    <text x="287" y="169" fill="#F8FAFF" font-size="95" font-weight="750"><title>34M: ODEs in the complex domain — weighted 32</title>34M</text>
    <text x="737" y="169" fill="#E5ECFA" font-size="65" font-weight="750"><title>34E: Asymptotic theory of ODEs — weighted 8</title>34E</text>
    <text x="182" y="254" fill="#C9DBF8" font-size="46">40G</text>
    <text x="471" y="254" fill="#D7E2F5" font-size="42">34A</text>
