<svg xmlns="http://www.w3.org/2000/svg" width="960" height="516" viewBox="0 0 960 516" role="img" aria-labelledby="cloud-title cloud-desc">
  <title id="cloud-title">MSC 2020 subject groups</title>
  <desc id="cloud-desc">Weighted frequencies for 20 MSC subject groups, with primary codes counting twice. The largest are 34M at 32 and 34E at 8, followed by 14H at 5 and 40G at 4.</desc>
  <defs>
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192B61"/>
      <stop offset="55%" stop-color="#152858"/>
      <stop offset="100%" stop-color="#11214D"/>
    </linearGradient>
  </defs>
  <rect x=".75" y=".75" width="958.5" height="514.5" fill="url(#card-blue)" stroke="#8496B9" stroke-width="1.5"/>
  <path d="M44 83H916" stroke="#526DA2" stroke-width="1" opacity=".9"/>
  <text x="46" y="55" fill="#C8D8F2" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="3">RESEARCH AREAS</text>
  <text x="915" y="55" fill="#B5C7E9" font-family="Arial,Helvetica,sans-serif" text-anchor="end" font-size="12" letter-spacing="1.4">MSC subject groups</text>
