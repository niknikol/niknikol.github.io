    <text x="584" y="328" fill="#A6BDE9" font-size="39">32G</text>
    <text x="802" y="328" fill="#B8CBEA" font-size="35">32S</text>
    <text x="143" y="402" fill="#A6BDE9" font-size="31">01A</text>
